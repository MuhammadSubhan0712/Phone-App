<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone App</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous" />
  </head>

  <body class="text-white">
    <h1 class="text-center mt-4">
      <span>(!)(!)(!) </span> Phones Store <span> (!)(!)(!) </span>
    </h1>
    <div
      class="mt-4 p-1 d-flex justify-content-evenly flex-wrap filter-buttons">
      <button id="All-items" class="filter-btn" onclick="renderItems()">
        All Items
      </button>
      <button class="filter-btn" onclick="filtereditems('Samsung')">
        Samsung
      </button>
      <button class="filter-btn" onclick="filtereditems('Iphone')">
        Iphone
      </button>
      <button class="filter-btn" onclick="filtereditems('Infinix')">
        Infinix
      </button>
      <button class="filter-btn" onclick="filtereditems('Tecno')">Tecno</button>
      <button class="filter-btn" onclick="filtereditems('Oppo')">Oppo</button>
      <button class="filter-btn" onclick="filtereditems('Vivo')">Vivo</button>
      <button class="filter-btn" onclick="filtereditems('Realme')">
        Realme
      </button>
      <button class="filter-btn" onclick="filtereditems('Redmi')">Redmi</button>
    </div>

    <div
      class="products mt-5 d-flex justify-content-center gap-5 flex-wrap"></div>

    <div class="text-center m-5">
      <button onclick="gotocart()" class="btn btn-success checkout-btn">
        Checkout
      </button>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"></script>
    <script src="app.js"></script>
  </body>
</html>
